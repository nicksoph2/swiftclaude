name: ClaudeConfigManager
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: "15.0"

settings:
  base:
    SWIFT_VERSION: 5.10
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic

packages: {}

targets:
  ClaudeConfigManager:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: App
      - path: Core
      - path: Features
      - path: Infrastructure
      - path: Resources
        excludes:
          - "ClaudeConfigManager.help/**"
      - path: Resources/ClaudeConfigManager.help
        buildPhase: resources
        type: folder
    info:
      path: Resources/Info.plist
      properties:
        CFBundleHelpBookFolder: ClaudeConfigManager.help
        CFBundleHelpBookName: com.example.ClaudeConfigManager.help
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ClaudeConfigManager
        CODE_SIGN_ENTITLEMENTS: Resources/ClaudeConfigManager.entitlements

  ClaudeConfigManagerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: ../ClaudeConfigManagerTests
        excludes:
          - "Fixtures/**"
      - path: ../ClaudeConfigManagerTests/Fixtures
        buildPhase: none
    dependencies:
      - target: ClaudeConfigManager
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ClaudeConfigManager.app/Contents/MacOS/ClaudeConfigManager

  ClaudeConfigManagerUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: ../ClaudeConfigManagerUITests
    dependencies:
      - target: ClaudeConfigManager
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ClaudeConfigManager

schemes:
  ClaudeConfigManager:
    build:
      targets:
        ClaudeConfigManager: all
        ClaudeConfigManagerTests: [test]
        ClaudeConfigManagerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClaudeConfigManagerTests
