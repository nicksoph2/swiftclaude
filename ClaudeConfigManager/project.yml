name: ClaudeConfigManager
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: "15.0"

settings:
  base:
    SWIFT_VERSION: 5.10
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic

packages: {}

targets:
  ClaudeConfigManager:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: App
      - path: Core
      - path: Features
      - path: Infrastructure
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ClaudeConfigManager
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/ClaudeConfigManager.entitlements

  ClaudeConfigManagerTests:
    type: bundle.unit-testing
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: ../ClaudeConfigManagerTests
    dependencies:
      - target: ClaudeConfigManager
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ClaudeConfigManager.app/Contents/MacOS/ClaudeConfigManager

schemes:
  ClaudeConfigManager:
    build:
      targets:
        ClaudeConfigManager: all
        ClaudeConfigManagerTests: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClaudeConfigManagerTests
